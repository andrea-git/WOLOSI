<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Workout Logbook</title>
  <link rel="stylesheet" href="./styles.css?v=7.4-workout-total-timer" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Workout Logbook</h1>
        <div id="dayName" class="subtitle"></div>
      </div>
      <div class="sync-wrap"><span id="syncStatus" class="sync-status">Cloud…</span><div class="actions">
        <button id="exportBtn" class="icon-btn" title="Esporta backup" aria-label="Esporta backup">⇩</button>
        <button id="importBtn" class="icon-btn" title="Importa backup" aria-label="Importa backup">⇧</button>
        <input id="importFile" type="file" accept="application/json" hidden />
      </div></div>
    </header>

    <nav id="tabs" class="tabs" aria-label="Giorni allenamento"></nav>

    <div class="date-row">
      <label for="dateInput">Data</label>
      <input id="dateInput" type="date" />
    </div>

    <div class="workout-total-timer" aria-label="Cronometro totale workout">
      <button id="workoutStartBtn" type="button" class="workout-start-btn">START</button>
      <span id="workoutTotalDisplay" class="workout-total-display">00:00:00</span>
      <button id="workoutEndBtn" type="button" class="workout-end-btn">END</button>
    </div>

    <section id="exerciseList" class="exercise-list"></section>
  </main>

  <template id="exerciseTemplate">
    <article class="exercise-card">
      <div class="exercise-head-row">
        <div class="exercise-head">
          <h2 class="exercise-name"></h2>
          <div class="exercise-meta"></div>
          <div class="exercise-machine-block">
            <label class="machine-field">Macchina
              <input class="machine-input" type="text" placeholder="es. Precor nera" autocomplete="off">
            </label>
            <div class="exercise-id-row">
              <div class="exercise-id-display">
                <span class="exercise-id-label">ID</span>
                <code class="exercise-id-value"></code>
              </div>
              <button type="button" class="edit-id-btn">Modifica ID</button>
            </div>
          </div>
          <div class="exercise-static-note"></div>
        </div>
        <div class="exercise-side">
          <div class="exercise-actions">
            <button type="button" class="copy-last-btn" title="Copia ultimo workout">Copia ultimo</button>
            <button type="button" class="clear-today-btn" title="Pulisci i campi di oggi">Pulisci</button>
          </div>
          <div class="machine-photo-area">
            <div class="machine-photo-box">
              <button type="button" class="machine-photo-open" title="Apri foto macchina" hidden>
                <img class="machine-photo-thumb" alt="Foto macchina">
              </button>
              <button type="button" class="machine-photo-add">+ Foto</button>
            </div>
            <div class="machine-photo-controls">
              <button type="button" class="machine-photo-change" hidden>Cambia foto</button>
              <button type="button" class="machine-photo-remove" hidden>Rimuovi foto</button>
            </div>
            <input class="machine-photo-file" type="file" accept="image/*" hidden>
          </div>
        </div>
      </div>
      <div class="grid-wrap">
        <table class="load-grid">
          <thead>
            <tr>
              <th>Serie</th>
              <th class="today-head">
                <span>Oggi</span>
                <button type="button" class="performance-indicator performance-trigger current-performance-indicator" title="Valuta la prestazione">?</button>
              </th>
              <th class="prev-date-1">
                <span class="history-date-label">—</span>
                <button type="button" class="performance-indicator performance-trigger prev1-performance-indicator" title="Valuta la prestazione">?</button>
              </th>
              <th class="prev-date-2">
                <span class="history-date-label">—</span>
                <button type="button" class="performance-indicator performance-trigger prev2-performance-indicator" title="Valuta la prestazione">?</button>
              </th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="table-actions-row">
        <button type="button" class="history-open-btn" title="Apri storico esteso" aria-label="Apri storico esteso">+</button>
        <div class="stopwatch">
          <span class="stopwatch-display">00:00</span>
          <button type="button" class="stopwatch-go" title="Avvia">▶</button>
          <button type="button" class="stopwatch-pause" title="Pausa">Ⅱ</button>
          <button type="button" class="stopwatch-stop" title="Stop">■</button>
          <button type="button" class="stopwatch-reset" title="Azzera">↺</button>
        </div>
        <div class="set-row-controls">
          <button type="button" class="remove-set-btn">− Serie</button>
          <button type="button" class="add-set-btn">+ Serie</button>
        </div>
      </div>
      <textarea class="notes" rows="2" placeholder="Note…"></textarea>
    </article>
  </template>


  <div id="idModal" class="modal-backdrop" hidden>
    <div class="id-modal" role="dialog" aria-modal="true" aria-labelledby="idModalTitle">
      <div class="id-modal-head">
        <h2 id="idModalTitle">Modifica ID esercizio</h2>
        <button id="idModalClose" type="button" class="modal-close" aria-label="Chiudi">×</button>
      </div>
      <p class="id-modal-warning">Cambiare ID crea da questo momento uno storico separato. Lo storico precedente resta associato al vecchio ID.</p>
      <label class="id-modal-field">Nuovo ID
        <input id="idModalInput" type="text" autocomplete="off" spellcheck="false">
      </label>
      <div class="id-modal-actions">
        <button id="idModalCancel" type="button" class="modal-secondary">Annulla</button>
        <button id="idModalSave" type="button" class="modal-primary">Salva ID</button>
      </div>
    </div>
  </div>

  <div id="photoModal" class="photo-modal-backdrop" hidden>
    <button id="photoModalClose" class="photo-modal-close" type="button" aria-label="Chiudi foto">×</button>
    <img id="photoModalImage" class="photo-modal-image" alt="Foto macchina ingrandita">
  </div>

  <div id="historyModal" class="history-modal-backdrop" hidden>
    <div class="history-modal" role="dialog" aria-modal="true" aria-labelledby="historyModalTitle">
      <div class="history-modal-head">
        <div>
          <h2 id="historyModalTitle">Storico</h2>
          <div id="historyModalMeta" class="history-modal-meta"></div>
        </div>
        <button id="historyModalClose" type="button" class="modal-close" aria-label="Chiudi storico">×</button>
      </div>
      <div id="historyModalScroller" class="history-modal-scroller"></div>
      <div class="history-modal-footer">
        <button id="historyLoadMore" type="button" class="history-load-more">Altri 10</button>
      </div>
    </div>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
